{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "helpdesk-api.fullname" . }}
  labels:
    {{- include "helpdesk-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "helpdesk-api.secretName" . }}
    creationPolicy: Owner
  # Expects a single AWS Secrets Manager secret at `remoteRef`, stored as
  # JSON: {"DATABASE_URL": "...", "JWT_SECRET": "..."}
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecret.remoteRef }}
        property: DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.externalSecret.remoteRef }}
        property: JWT_SECRET
{{- end }}
