apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helpdesk-api.fullname" . }}
  labels:
    {{- include "helpdesk-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "helpdesk-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helpdesk-api.selectorLabels" . | nindent 8 }}
      annotations:
        # Forces a rollout when the ConfigMap changes, since Deployments
        # don't watch ConfigMaps for changes on their own.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "helpdesk-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: helpdesk-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "helpdesk-api.fullname" . }}-config
            - secretRef:
                name: {{ include "helpdesk-api.secretName" . }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
